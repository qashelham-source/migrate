name: Test, secure, and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    env:
      API_ID: "12345"
      API_HASH: "ci-test-hash"
      BOT_TOKEN: "123456:ci-test-token"
      ADMIN_USER_ID: "12345"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check fatal Python errors
        run: python -m ruff check --select E9,F63,F7,F82 app tests main.py bot.py optimize_database.py reliability_check.py

      - name: Compile Python files
        run: python -m compileall -q app tests main.py bot.py optimize_database.py reliability_check.py

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:${PYTHONPATH}}" python -m pytest -q 2>&1 | tee pytest.log

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: warn

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt

      - name: Scan changed history for secrets
        uses: gitleaks/gitleaks-action@v2.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Docker Compose
        run: |
          cp config.example.yaml config.yaml
          docker compose config >/dev/null

      - name: Build Docker image
        run: docker build -t migration-manager:test .

      - name: Verify fresh database startup in read-only container
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:size=256m,mode=1777 \
            -e API_ID \
            -e API_HASH \
            -e BOT_TOKEN \
            -e ADMIN_USER_ID \
            migration-manager:test \
            /bin/sh -c 'cp /app/config.example.yaml /tmp/config.yaml && python /app/optimize_database.py --config /tmp/config.yaml && python /app/reliability_check.py --config /tmp/config.yaml --deep'

      - name: Scan container for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: migration-manager:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build clean ZIP
        run: |
          zip -r telegram-migration-fileid-final.zip . \
            -x '.git/*' \
               '.github/*' \
               '__pycache__/*' \
               '*/__pycache__/*' \
               '*.pyc' \
               '.env' \
               'config.yaml*' \
               'sessions/*' \
               'data/*' \
               'downloads/*' \
               'backups/*' \
               '*.zip' \
               '*.zip.zip'

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-migration-fileid-final
          path: telegram-migration-fileid-final.zip
          if-no-files-found: error
