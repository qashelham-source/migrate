telegram:
  api_id: "${API_ID}"
  api_hash: "${API_HASH}"
  user_session: "user"
  sessions_dir: "sessions"
  load_dialogs_on_start: true

  # Telegram numeric user IDs allowed to use the private control panel.
  # ADMIN_USER_ID may also be supplied as a comma-separated environment variable.
  admin_ids: []

  bot:
    enabled: true
    token: "${BOT_TOKEN}"
    session_name: "uploader_bot"
    use_for_uploads: true

# Source and destinations are configured from the Telegram control panel.
migration:
  sources: []
  destinations: []

transfer:
  include:
    videos: true
    photos: true
    text: true
    documents: false

  hide_sender: true
  drop_caption: false
  save_to_local: false
  max_bot_upload_bytes: 2097152000

  native_copy:
    enabled: true
    only: false

queue:
  db_path: "data/migration.sqlite3"
  max_attempts: 4
  retry_backoff_seconds: [300, 600, 1800]
  record_skipped: true

limits:
  global_min_delay_seconds: 0.5
  resolve_delay_seconds: 1
  read_delay_seconds: 1
  download_delay_seconds: 1
  copy_delay_seconds: 2
  upload_delay_seconds: 5
  verify_delay_seconds: 1
  get_messages_chunk_size: 100
  floodwait_extra_min_seconds: 5
  floodwait_extra_max_seconds: 15

batch:
  size: 100
  pause_between_batches_seconds: 120
  idle_sleep_seconds: 10

downloads:
  root: "downloads"
  active_dir: "downloads/active"
  failed_dir: "downloads/failed"
  completed_dir: "downloads/completed"
  keep_failed: false
  keep_completed: false

logging:
  level: "INFO"
  file: "data/migration.log"
