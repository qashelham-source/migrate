services:
  migration-manager:
    build:
      context: .
    container_name: migration-manager
    restart: unless-stopped
    init: true
    working_dir: /app
    environment:
      API_ID: "${API_ID:-}"
      API_HASH: "${API_HASH:-}"
      BOT_TOKEN: "${BOT_TOKEN:-}"
      RUN_INTERVAL_SECONDS: "${RUN_INTERVAL_SECONDS:-300}"
      LIVE_RECONCILE_SECONDS: "${LIVE_RECONCILE_SECONDS:-300}"
      LIVE_EVENT_DEBOUNCE_SECONDS: "${LIVE_EVENT_DEBOUNCE_SECONDS:-2}"
      STORAGE_RESERVE_BYTES: "${STORAGE_RESERVE_BYTES:-5368709120}"
      STORAGE_WARNING_FREE_BYTES: "${STORAGE_WARNING_FREE_BYTES:-10737418240}"
      STORAGE_CRITICAL_FREE_BYTES: "${STORAGE_CRITICAL_FREE_BYTES:-3221225472}"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./downloads:/app/downloads
    healthcheck:
      test: ["CMD", "python", "reliability_check.py", "--config", "/app/config.yaml", "--json"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        python optimize_database.py --config /app/config.yaml
        python main.py recover
        python main.py admin &
        admin_pid=$$!
        python main.py serve &
        service_pid=$$!

        cleanup() {
          kill "$$admin_pid" "$$service_pid" 2>/dev/null || true
          wait "$$admin_pid" "$$service_pid" 2>/dev/null || true
        }
        trap cleanup EXIT INT TERM

        while kill -0 "$$admin_pid" 2>/dev/null && kill -0 "$$service_pid" 2>/dev/null; do
          sleep 5
        done

        echo "Admin bot or live migration service stopped unexpectedly"
        exit 1
    stop_grace_period: 45s
