services:
  migration-manager:
    build:
      context: .
    container_name: migration-manager
    restart: unless-stopped
    init: true
    working_dir: /app
    environment:
      API_ID: "${API_ID:-}"
      API_HASH: "${API_HASH:-}"
      BOT_TOKEN: "${BOT_TOKEN:-}"
      RUN_INTERVAL_SECONDS: "${RUN_INTERVAL_SECONDS:-300}"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./downloads:/app/downloads
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        python main.py recover
        python main.py admin &
        admin_pid=$$!

        cleanup() {
          kill "$$admin_pid" 2>/dev/null || true
          wait "$$admin_pid" 2>/dev/null || true
        }
        trap cleanup EXIT INT TERM

        while kill -0 "$$admin_pid" 2>/dev/null; do
          mode=sync
          if [ -f /app/data/run_mode ]; then
            mode=$$(cat /app/data/run_mode 2>/dev/null || echo sync)
            rm -f /app/data/run_mode
          fi

          exit_code=0
          case "$$mode" in
            health)
              echo "Running pre-flight health check"
              python main.py health || exit_code=$$?
              ;;
            process)
              echo "Resuming pending queue without scanning"
              python main.py process || exit_code=$$?
              ;;
            sync)
              echo "Syncing only new source posts, then processing queue"
              python main.py sync || exit_code=$$?
              ;;
            run)
              echo "Running full scan and queue processing"
              python main.py run || exit_code=$$?
              ;;
            *)
              echo "Unknown run mode '$$mode'; using incremental sync"
              python main.py sync || exit_code=$$?
              ;;
          esac
          echo "Migration mode $$mode exited with code $$exit_code"

          elapsed=0
          interval=$${RUN_INTERVAL_SECONDS:-300}
          while [ "$$elapsed" -lt "$$interval" ]; do
            kill -0 "$$admin_pid" 2>/dev/null || exit 1
            if [ -f /app/data/run_now ]; then
              rm -f /app/data/run_now
              echo "Run requested from Telegram control panel"
              break
            fi
            sleep 5
            elapsed=$$((elapsed + 5))
          done
        done

        wait "$$admin_pid"
    stop_grace_period: 30s
