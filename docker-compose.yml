x-migration-common: &migration-common
  build:
    context: .
    args:
      APP_UID: "${APP_UID:-10001}"
      APP_GID: "${APP_GID:-10001}"
  restart: unless-stopped
  init: true
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  working_dir: /app
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
  environment:
    API_ID: "${API_ID:-}"
    API_HASH: "${API_HASH:-}"
    BOT_TOKEN: "${BOT_TOKEN:-}"
    ADMIN_USER_ID: "${ADMIN_USER_ID:-}"
    MINI_APP_ENABLED: "${MINI_APP_ENABLED:-}"
    MINI_APP_URL: "${MINI_APP_URL:-}"
    MINI_APP_HOST: "${MINI_APP_HOST:-0.0.0.0}"
    MINI_APP_PORT: "${MINI_APP_PORT:-8080}"
    MINI_APP_AUTH_MAX_AGE_SECONDS: "${MINI_APP_AUTH_MAX_AGE_SECONDS:-3600}"
    RUN_INTERVAL_SECONDS: "${RUN_INTERVAL_SECONDS:-300}"
    LIVE_RECONCILE_SECONDS: "${LIVE_RECONCILE_SECONDS:-300}"
    LIVE_EVENT_DEBOUNCE_SECONDS: "${LIVE_EVENT_DEBOUNCE_SECONDS:-2}"
    STORAGE_RESERVE_BYTES: "${STORAGE_RESERVE_BYTES:-5368709120}"
    STORAGE_WARNING_FREE_BYTES: "${STORAGE_WARNING_FREE_BYTES:-10737418240}"
    STORAGE_CRITICAL_FREE_BYTES: "${STORAGE_CRITICAL_FREE_BYTES:-3221225472}"
  volumes:
    - ./config.yaml:/app/config.yaml
    - ./sessions:/app/sessions
    - ./data:/app/data
    - ./downloads:/app/downloads
  stop_grace_period: 45s

services:
  # One failure must not terminate the migration worker, admin bot, and mini app together.
  migration-manager:
    <<: *migration-common
    container_name: migration-manager
    healthcheck:
      test: ["CMD", "python", "reliability_check.py", "--config", "/app/config.yaml", "--json"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        python optimize_database.py --config /app/config.yaml
        python main.py recover
        exec python main.py serve

  migration-admin:
    <<: *migration-common
    container_name: migration-admin
    depends_on:
      migration-manager:
        condition: service_healthy
    command: ["python", "main.py", "admin"]

  migration-web:
    <<: *migration-common
    container_name: migration-web
    # The public HTTPS endpoint is terminated by Caddy/Nginx on the host.
    ports:
      - "127.0.0.1:${MINI_APP_PORT:-8080}:${MINI_APP_PORT:-8080}"
    command: ["python", "main.py", "web"]
